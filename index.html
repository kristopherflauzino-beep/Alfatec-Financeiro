<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081321"><meta http-equiv="Cache-Control" content="no-store"><title>AlfaTec Financeiro | Entrar</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 75% -15%,#114a85,#071426 58%);color:#ecf4ff;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(420px,100%);background:#0f2038;border:1px solid #29415d;border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 35px 90px #0107138c}img{width:132px;height:132px;object-fit:contain;display:block;margin:auto}h1{text-align:center;margin:6px 0;font-size:26px}p{text-align:center;color:#9fb7d5;margin:4px 0 30px}label{display:block;font-weight:650;font-size:13px;margin:15px 0 7px}input{width:100%;border:1px solid #335471;background:#09182e;border-radius:11px;padding:14px;color:white;font-size:16px}button{width:100%;border:0;background:linear-gradient(100deg,#136ced,#08bfff);color:white;font-weight:750;font-size:16px;padding:14px;border-radius:11px;margin-top:23px}button:disabled{opacity:.6}#alert{color:#ffa8b4;text-align:center;margin-top:16px;min-height:22px}footer{color:#6f91b6;text-align:center;font-size:12px;margin-top:26px}</style></head><body><main><img src="/logo.webp" alt="Logo AlfaTec"><h1>AlfaTec Financeiro</h1><p>Acesso administrativo protegido</p><form id="form"><label for="u">Usuário</label><input id="u" name="username" autocomplete="username" required maxlength="40" autofocus><label for="p">Senha</label><input id="p" type="password" name="password" autocomplete="current-password" required><button id="submit">Entrar com segurança</button><div id="alert" role="alert" aria-live="polite"></div></form><footer>Alterações registradas por usuário • AlfaTec</footer></main><script>
(async()=>{try{let r=await fetch('/api/me',{cache:'no-store'});if(r.ok)location.replace('/api/app')}catch{}})();
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),a=document.getElementById('alert');b.disabled=true;a.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'Não foi possível autenticar.')}location.replace('/api/app')}catch(err){a.textContent=err.message}finally{b.disabled=false}};
</script></body></html>

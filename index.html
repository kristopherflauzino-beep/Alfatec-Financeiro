<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081321"><meta http-equiv="Cache-Control" content="no-store"><title>AlfaTec Financeiro | Entrar</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 75% -15%,#114a85,#071426 58%);color:#ecf4ff;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(420px,100%);background:#0f2038;border:1px solid #29415d;border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 35px 90px #0107138c}img{width:132px;height:132px;object-fit:contain;display:block;margin:auto}h1{text-align:center;margin:6px 0;font-size:26px}p{text-align:center;color:#9fb7d5;margin:4px 0 30px}label{display:block;font-weight:650;font-size:13px;margin:15px 0 7px}input{width:100%;border:1px solid #335471;background:#09182e;border-radius:11px;padding:14px;color:white;font-size:16px}button{width:100%;border:0;background:linear-gradient(100deg,#136ced,#08bfff);color:white;font-weight:750;font-size:16px;padding:14px;border-radius:11px;margin-top:23px}button:disabled{opacity:.6}button{cursor:pointer}button.secondary{margin-top:13px;border:1px solid #3a5e82;background:#142d4d}form[hidden]{display:none}#register-form{padding-top:18px;border-top:1px solid #36516c;margin-top:20px}h2{font-size:20px;margin:0 0 8px}p.sub{font-size:13px;line-height:1.4;margin:0 0 8px}#register-alert{margin-top:12px;color:#a7e8c7;min-height:18px;font-size:14px;line-height:1.4}#alert{color:#ffa8b4;text-align:center;margin-top:16px;min-height:22px}footer{color:#6f91b6;text-align:center;font-size:12px;margin-top:26px}</style></head><body><main><img src="/logo.webp" alt="Logo AlfaTec"><h1>AlfaTec Financeiro</h1><p>Acesso seguro com auditoria</p><form id="form"><label for="u">Usuário</label><input id="u" name="username" autocomplete="username" required maxlength="40" placeholder="Kristopher" autofocus><label for="p">Senha</label><input id="p" type="password" name="password" autocomplete="current-password" required><button id="submit">Entrar com segurança</button><div id="alert" role="alert" aria-live="polite"></div></form>
<button type="button" class="secondary" id="create-toggle" aria-expanded="false" aria-controls="register-form">Criar usuário</button>
<form id="register-form" hidden><h2>Solicitar acesso</h2><p class="sub">Seu cadastro será aprovado pelo administrador principal antes do primeiro login.</p>
<label for="rn">Nome completo</label><input id="rn" required minlength="2" maxlength="120" autocomplete="name">
<label for="ru">Novo usuário</label><input id="ru" required minlength="3" maxlength="40" autocomplete="username">
<label for="rp">Senha (mínimo 6 caracteres)</label><input id="rp" type="password" required minlength="6" maxlength="256" autocomplete="new-password">
<label for="rc">Confirmar senha</label><input id="rc" type="password" required minlength="6" autocomplete="new-password">
<button id="register-submit">Solicitar cadastro</button><div id="register-alert" role="status" aria-live="polite"></div></form><footer>Alterações registradas por usuário • AlfaTec</footer></main><script>
(async()=>{try{let r=await fetch('/api/me',{cache:'no-store'});if(r.ok)location.replace('/api/app')}catch{}})();
document.getElementById('create-toggle').onclick=()=>{const f=document.getElementById('register-form'),b=document.getElementById('create-toggle');f.hidden=!f.hidden;b.setAttribute('aria-expanded',String(!f.hidden));b.textContent=f.hidden?'Criar usuário':'Fechar cadastro';if(!f.hidden)document.getElementById('rn').focus()};
document.getElementById('register-form').onsubmit=async e=>{e.preventDefault();const submit=document.getElementById('register-submit'),a=document.getElementById('register-alert');if(document.getElementById('rp').value!==document.getElementById('rc').value){a.style.color='#ffb1b8';a.textContent='As senhas digitadas não coincidem.';return}submit.disabled=true;a.textContent='';try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('ru').value,display_name:document.getElementById('rn').value,password:document.getElementById('rp').value,confirm_password:document.getElementById('rc').value})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível cadastrar');a.style.color='#a7e8c7';a.textContent=d.message;document.getElementById('register-form').reset()}catch(err){a.style.color='#ffb1b8';a.textContent=err.message}finally{submit.disabled=false}};
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),a=document.getElementById('alert');b.disabled=true;a.textContent='';try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});if(!r.ok){let d=await r.json().catch(()=>({}));throw Error(d.error||'Não foi possível autenticar.')}location.replace('/api/app')}catch(err){a.textContent=err.message}finally{b.disabled=false}};
</script></body></html>

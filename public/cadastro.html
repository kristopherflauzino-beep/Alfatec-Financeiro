<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081321">
<meta http-equiv="Cache-Control" content="no-store">
<title>AlfaTec Financeiro | Criar usuário</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:radial-gradient(circle at 75% -15%,#114a85,#071426 58%);color:#ecf4ff;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(420px,100%);background:#0f2038;border:1px solid #29415d;border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 35px 90px #0107138c}img{width:132px;height:132px;object-fit:contain;display:block;margin:auto}h1{text-align:center;margin:6px 0;font-size:26px}p{text-align:center;color:#9fb7d5;margin:4px 0 30px}label{display:block;font-weight:650;font-size:13px;margin:15px 0 7px}input{width:100%;border:1px solid #335471;background:#09182e;border-radius:11px;padding:14px;color:white;font-size:16px}button{width:100%;border:0;background:linear-gradient(100deg,#136ced,#08bfff);color:white;font-weight:750;font-size:16px;padding:14px;border-radius:11px;margin-top:23px}button:disabled{opacity:.6}button{cursor:pointer}button.secondary{margin-top:13px;border:1px solid #3a5e82;background:#142d4d}form[hidden]{display:none}#register-form{padding-top:18px;border-top:1px solid #36516c;margin-top:20px}h2{font-size:20px;margin:0 0 8px}p.sub{font-size:13px;line-height:1.4;margin:0 0 8px}#register-alert{margin-top:12px;color:#a7e8c7;min-height:18px;font-size:14px;line-height:1.4}#alert{color:#ffa8b4;text-align:center;margin-top:16px;min-height:22px}footer{color:#6f91b6;text-align:center;font-size:12px;margin-top:26px}
/* ALFATEC_PASSWORD_EYE_V1 */
.password-eye-field{position:relative;display:block;width:100%;min-width:0}
.password-eye-field>input{width:100%;padding-right:52px!important}
.password-eye-toggle{position:absolute!important;right:7px;top:50%;transform:translateY(-50%);z-index:2;display:flex!important;align-items:center;justify-content:center;flex:0 0 auto;width:39px!important;height:39px!important;min-width:39px!important;margin:0!important;padding:0!important;border:0!important;border-radius:8px!important;background:transparent!important;box-shadow:none!important;color:#a9c6e7!important;cursor:pointer}
.password-eye-toggle:hover{background:rgba(115,163,208,.15)!important;color:white!important}
.password-eye-toggle:focus-visible{outline:2px solid #66d0ff!important;outline-offset:2px}
.password-eye-toggle svg{width:21px;height:21px;display:block;pointer-events:none}

main{width:min(470px,100%)}
.back-link{display:inline-flex;align-items:center;gap:9px;color:#9dd7ff;text-decoration:none;font-weight:650;font-size:14px;margin-bottom:12px;padding:7px 1px}
.back-link:hover{text-decoration:underline}.back-link:focus-visible{outline:2px solid #66d0ff;outline-offset:4px}
#register-form{padding:0;border:0;margin:0}
#register-alert{padding:0;min-height:21px;line-height:1.45}
#register-alert:not(:empty){padding:11px 12px;border-radius:10px;background:#12344a}
footer{margin-top:20px}
.bottom-back{text-align:center;margin-top:18px;font-size:14px;color:#afc6df}
.bottom-back a{color:#66ceff;font-weight:700;text-decoration:none}
.bottom-back a:hover{text-decoration:underline}
.small-hint{font-size:12px;color:#9fb7d5;margin:7px 0 10px;line-height:1.4}
button:focus-visible,input:focus-visible{outline:2px solid #66d0ff;outline-offset:2px}
</style>
</head>
<body>
<main>
<a class="back-link" href="/">← Voltar para o login</a>
<img src="/logo.webp" alt="Logo AlfaTec">
<h1>Criar usuário</h1>
<p>Solicite acesso ao AlfaTec Financeiro</p>
<form id="register-form">
<label for="rn">Nome completo</label>
<input id="rn" name="display_name" required minlength="2" maxlength="120" autocomplete="name" autofocus placeholder="Nome e sobrenome">
<label for="ru">Nome de usuário</label>
<input id="ru" name="username" required minlength="3" maxlength="40" autocomplete="username" placeholder="Seu usuário">
<label for="rp">Senha</label>
<input id="rp" name="password" type="password" required minlength="6" maxlength="256" autocomplete="new-password" placeholder="Mínimo de 6 caracteres">
<div class="small-hint">Use uma senha exclusiva para este sistema.</div>
<label for="rc">Confirmar senha</label>
<input id="rc" name="confirm_password" type="password" required minlength="6" maxlength="256" autocomplete="new-password" placeholder="Repita a senha">
<button id="register-submit" type="submit">Solicitar cadastro</button>
<div id="register-alert" role="status" aria-live="polite"></div>
</form>
<div class="bottom-back">Já possui uma conta? <a href="/">Voltar para o login</a></div>
<footer>Novas contas precisam da aprovação do administrador principal.</footer>
</main>
<script>
const $=id=>document.getElementById(id);
$('register-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const button=$('register-submit'),message=$('register-alert');
  const password=$('rp').value,confirmation=$('rc').value;
  message.textContent='';
  if(password!==confirmation){message.style.color='#ffc0c7';message.textContent='As senhas digitadas não coincidem.';return;}
  if(password.length<6){message.style.color='#ffc0c7';message.textContent='A senha precisa ter no mínimo 6 caracteres.';return;}
  button.disabled=true;
  try{
    const response=await fetch('/api/register',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      username:$('ru').value,
      display_name:$('rn').value,
      password,
      confirm_password:confirmation
    })});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw Error(data.error||'Não foi possível solicitar o cadastro.');
    $('register-form').reset();
    message.style.color='#b7f2cf';
    message.textContent=data.message||'Solicitação enviada para aprovação do administrador.';
  }catch(error){
    message.style.color='#ffc0c7';
    message.textContent=error.message;
  }finally{button.disabled=false;}
});
</script>
<!-- ALFATEC_PASSWORD_EYE_V1 -->
<script>
(()=>{
  'use strict';
  const eyeOpen='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeClosed='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 5.1c.4-.07.83-.1 1.3-.1 6.5 0 10 7 10 7a16.2 16.2 0 0 1-3 3.8M6.1 6.1A16.7 16.7 0 0 0 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
  for(const input of document.querySelectorAll('input[type="password"]')){
    if(input.closest('.password-eye-field'))continue;
    const box=document.createElement('span');
    box.className='password-eye-field';
    input.parentNode.insertBefore(box,input);
    box.append(input);
    const toggle=document.createElement('button');
    toggle.type='button';
    toggle.className='password-eye-toggle';
    toggle.setAttribute('aria-label','Mostrar senha');
    toggle.setAttribute('title','Mostrar senha');
    toggle.setAttribute('aria-pressed','false');
    toggle.innerHTML=eyeOpen;
    toggle.addEventListener('click',()=>{
      const reveal=input.type==='password';
      input.type=reveal?'text':'password';
      toggle.setAttribute('aria-label',reveal?'Ocultar senha':'Mostrar senha');
      toggle.setAttribute('title',reveal?'Ocultar senha':'Mostrar senha');
      toggle.setAttribute('aria-pressed',String(reveal));
      toggle.innerHTML=reveal?eyeClosed:eyeOpen;
      input.focus({preventScroll:true});
    });
    box.append(toggle);
  }
})();
</script>
</body>
</html>
